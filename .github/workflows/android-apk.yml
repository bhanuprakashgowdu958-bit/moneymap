name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Ensure SDK 36
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK_DIR"
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi

      - name: Install frontend dependencies & sync Capacitor
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap sync android

      - name: Grant Gradle Wrapper execute permission
        working-directory: frontend/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk MoneyMap.apk

      - name: Upload MoneyMap.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMap-Android-APK
          path: MoneyMap.apk
          retention-days: 30
