name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Ensure SDK 36
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK_DIR"
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build web assets
        working-directory: frontend
        run: npm run build:native

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Grant Gradle Wrapper execute permission
        working-directory: frontend/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Restore Cached Signing Keystore
        uses: actions/cache@v4
        with:
          path: frontend/android/app/moneymap-release.keystore
          key: moneymap-release-keystore-v1

      - name: Generate or Restore Signing Keystore
        working-directory: frontend/android
        run: |
          KEYSTORE_PATH="app/moneymap-release.keystore"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
            echo "✅ Restored keystore from secret"
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "✅ Restored keystore from GitHub Actions cache"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias moneymap \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass moneymap123 -keypass moneymap123 \
              -dname "CN=MoneyMap, OU=Dev, O=MoneyMap, L=Bangalore, ST=Karnataka, C=IN"
            echo "✅ Generated new release-signing keystore"
          fi

          echo "📋 SHA-1 Fingerprint (add this to Firebase):"
          keytool -list -v -keystore "$KEYSTORE_PATH" \
            -alias moneymap -storepass moneymap123 2>/dev/null | grep SHA1

      - name: Build Release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease
        env:
          MONEYMAP_KEYSTORE: moneymap-release.keystore
          MONEYMAP_STORE_PASSWORD: moneymap123
          MONEYMAP_KEY_ALIAS: moneymap
          MONEYMAP_KEY_PASSWORD: moneymap123

      - name: Rename APK
        run: |
          APK=$(find frontend/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find frontend/android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          fi
          cp "$APK" MoneyMap.apk

      - name: Upload MoneyMap.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyMap-Android-APK
          path: MoneyMap.apk
          retention-days: 30

      - name: Publish APK to Latest GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest MoneyMap.apk --clobber
          else
            gh release create latest MoneyMap.apk \
              --title "MoneyMap Latest Android APK" \
              --notes "Latest automated Android APK build from main."
          fi

  cleanup-old-runs:
    name: Delete old workflow runs
    runs-on: ubuntu-latest
    needs: build-android-apk
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete all but the 2 most recent runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          WORKFLOW="android-apk.yml"
          KEEP=2

          # Fetch all run IDs sorted newest first, skip the first KEEP=2
          RUN_IDS=$(gh api \
            "repos/$REPO/actions/workflows/$WORKFLOW/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[2:] | .[].id')

          if [ -z "$RUN_IDS" ]; then
            echo "Nothing to delete — fewer than $KEEP runs exist."
            exit 0
          fi

          for ID in $RUN_IDS; do
            echo "Deleting run $ID..."
            gh api -X DELETE "repos/$REPO/actions/runs/$ID" || true
          done
          echo "✅ Cleanup done. Kept the $KEEP most recent runs."
